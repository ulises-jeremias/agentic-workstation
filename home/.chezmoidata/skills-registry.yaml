# Skills Registry
#
# This file documents skills known to this baseline.
# It is used by `dots-skills` for npm-sourced skills (install + sync).
#
# Keep in sync with home/dot_local/share/agentic-workstation/skills-registry.yaml (deployed copy).
#
# Skills from github/url sources are managed natively by chezmoi:
#   home/dot_local/share/agentic-workstation/.chezmoiexternal.toml.tmpl
#   Opt-in via chezmoidata install_skill_* flags.
#
# Thin workstation: first-party skills are delegated to agent-toolkit via
# `dots-skills install-toolkit`.
# Only workstation-specific orchestration skills remain here; cross-domain
# skills (clickup-cli, github-cli-workflow, dbt-validation, figma*, etc.)
# are now provided by agent-toolkit (60 skills) and cleaned via
# .chezmoiremove on each target.
#
# Field reference:
#   name:     Unique kebab-case identifier
#   source:   bundled | npm  (github/url → see .chezmoiexternal.toml.tmpl)
#   enabled:  Whether this skill is active by default

skills:
  # ── Workstation-specific orchestration (not in agent-toolkit) ──────────────
  - name: dots-workstation-triage
    source: bundled
    enabled: true

  - name: dots-workstation-assistant
    source: bundled
    enabled: true

  - name: dots-workstation-workflow-generic-project
    source: bundled
    enabled: true
    # depends_on: github-cli-workflow and output-handshake now via agent-toolkit (60 skills) — delegated, not bundled

  - name: dots-workstation-dev-companion
    source: bundled
    enabled: true

  - name: dots-workstation-workflow-client-bootstrap
    source: bundled
    enabled: true

  # Deprecated stub dirs under skills/ — must NOT be managed by dots-skills sync
  # (chezmoi owns ~/.claude/skills/workflow-* → dots-workstation-workflow-* canonical paths).
  - name: workflow-generic-project
    source: bundled
    enabled: false

  - name: workflow-client-bootstrap
    source: bundled
    enabled: false

  - name: dots-slack-assistant
    source: bundled
    enabled: true

  - name: dots-harness-knowledge-sync
    source: bundled
    enabled: true

  # ── github/url skills → managed by .chezmoiexternal.toml.tmpl ────────────────
  # JIRA Assistant Skills (14 skills) — install_skill_jira_assistant = true
  # Confluence Assistant Skills (17 skills) — install_skill_confluence_assistant = true
  # See: home/dot_local/share/agentic-workstation/.chezmoiexternal.toml.tmpl
  #
  # Third-party note: external packs (JIRA, Confluence) and any future npm
  # third-party skills never belong in agent-toolkit's plugins/ (ADR-004).
  # Workstation owns their lifecycle via chezmoiexternal + skills-external/.
